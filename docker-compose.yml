# The site: one Laravel container (PHP-FPM + nginx) and, optionally, the
# Inertia SSR server built from the same image.
#
#   docker compose up --build            site on :3000
#   docker compose --profile ssr up      …plus server-side rendering
#
# First run: the admin account is seeded from ADMIN_EMAIL / ADMIN_PASSWORD.
#
#   docker compose exec site php artisan db:seed --class=AdminUserSeeder
#
# Data that must outlive the container — the SQLite database and uploaded
# images — lives in the two named volumes. Point DB_* at MySQL/Postgres in
# the environment to skip SQLite entirely.

services:
  site:
    build: ./site
    ports:
      - "${PORT:-3000}:8080"
    environment:
      APP_ENV: production
      APP_DEBUG: "false"
      APP_KEY: "${APP_KEY:?set APP_KEY (php artisan key:generate --show)}"
      APP_URL: "${APP_URL:-https://deveze.bleon.net}"
      DB_CONNECTION: sqlite
      DB_DATABASE: /var/www/html/database/database.sqlite
      ADMIN_EMAIL: "${ADMIN_EMAIL:-admin@example.com}"
      ADMIN_PASSWORD: "${ADMIN_PASSWORD:-change-me}"
      INERTIA_SSR_ENABLED: "${INERTIA_SSR_ENABLED:-false}"
      INERTIA_SSR_URL: http://ssr:13714
      # Trust the proxy in front (Coolify/Traefik) so generated URLs are https.
      TRUSTED_PROXIES: "*"
    volumes:
      - database:/var/www/html/database
      - uploads:/var/www/html/storage/app/public
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8080/up"]
      interval: 30s
      timeout: 3s
      start_period: 15s
      retries: 3

  # Renders the first paint of each page on the server. Same image, no nginx —
  # just the Node bundle Vite built. Opt in with `--profile ssr` and
  # INERTIA_SSR_ENABLED=true.
  ssr:
    build: ./site
    profiles: ["ssr"]
    command: ["node", "bootstrap/ssr/ssr.js"]
    environment:
      AUTORUN_ENABLED: "false"
    restart: unless-stopped

volumes:
  database:
  uploads:
