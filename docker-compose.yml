# Runs both portfolios side by side.
#
#   docker compose up --build        both
#   docker compose up portfolio      just the new one
#
# The new site is on :3000, the old one on :3002, so you can put them next to
# each other in two tabs and compare. Both are overridable when something else
# on the machine already holds the port:
#
#   PORT_NEW=4000 PORT_OLD=4001 docker compose up

services:
  portfolio:
    build:
      context: ./web
      args:
        # Origin used for canonical and social-preview URLs. Build-time, not
        # runtime — see web/Dockerfile. Prefers an explicit VITE_SITE_URL, then
        # the domain Coolify assigns this service, then the canonical domain
        # baked into src/config/site.ts.
        VITE_SITE_URL: "${VITE_SITE_URL:-${SERVICE_URL_PORTFOLIO:-}}"
    environment:
      NODE_ENV: production
      PORT: "3000"
    restart: unless-stopped
    healthcheck:
      # 127.0.0.1, not localhost: in some container runtimes localhost
      # resolves to ::1 first, and Nitro listens on IPv4 only — the check
      # then fails against a closed IPv6 socket while the app is fine.
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:3000/"]
      interval: 30s
      timeout: 3s
      start_period: 10s
      retries: 3

  # The previous site, kept runnable for reference until the new one replaces
  # it in production. Nothing depends on it.
