# The site: one Laravel container, PHP-FPM behind nginx.
#
#   docker compose up --build            site on :3000
#
# First run: the admin account is seeded from ADMIN_EMAIL / ADMIN_PASSWORD.
#
#   docker compose exec site php artisan db:seed --class=AdminUserSeeder
#
# Uploaded images live in the `uploads` volume. The database is MySQL when
# DB_* say so; otherwise a SQLite file in the `database` volume.

services:
  app:
    build: .
    environment:
      APP_ENV: production
      APP_DEBUG: "false"
      APP_KEY: "${APP_KEY:?set APP_KEY (php artisan key:generate --show)}"
      APP_URL: "${SERVICE_URL_APP:-http://localhost:3000}"
      # Point these at MySQL in the deploy environment; unset, it runs on the
      # SQLite file in the `database` volume.
      DB_CONNECTION: "${DB_CONNECTION:-sqlite}"
      DB_HOST: "${DB_HOST:-}"
      DB_PORT: "${DB_PORT:-3306}"
      DB_DATABASE: "${DB_DATABASE:-/var/www/html/database/database.sqlite}"
      DB_USERNAME: "${DB_USERNAME:-}"
      DB_PASSWORD: "${DB_PASSWORD:-}"
      ADMIN_EMAIL: "${ADMIN_EMAIL:-admin@bleon.net}"
      ADMIN_PASSWORD: "${ADMIN_PASSWORD:-change-me}"
      # Trust the proxy in front (Coolify/Traefik) so generated URLs are https.
      TRUSTED_PROXIES: "*"
    volumes:
      - database:/var/www/html/database
      - uploads:/var/www/html/storage/app/public
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8080/up"]
      interval: 30s
      timeout: 3s
      start_period: 15s
      retries: 3

volumes:
  database:
  uploads:
